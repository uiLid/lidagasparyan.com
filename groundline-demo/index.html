[data-theme=dark] .chip.red{background:#3A1A12;color:#FF9A73}[data-theme=dark] .chip.orange{background:#3A2412;color:#FFB27A}[data-theme=dark] .chip.amber{background:#3A3012;color:#F5C95C}[data-theme=dark] .chip.blue{background:#14253A;color:#8EC1FF}

@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}

:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
