<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CentrallApp · prototype · Lida Gasparyan</title>
<style>
@font-face{font-family:'Inter';src:url(../assets/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:#151A23;background:#F6F7F9;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}input,textarea,select{font:inherit}
:root{--line:#E7E9EE;--mute:#6B7280;--blue:#2F80ED;--ink:#111827;--green:#16A34A}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px}
.lg{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,#111827,#374151);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.cred{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid #DCE6F6;background:#F5F8FD;border-radius:6px;padding:5px 5px 5px 12px;font-weight:600;font-size:12px}.cred b{color:var(--blue);font-size:16px}
.gm{background:var(--blue);color:#fff;border-radius:4px;height:28px;padding:0 12px;font-weight:600;font-size:12px}
.me{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#C084FC,#EC4899);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.wrap{display:grid;grid-template-columns:200px 1fr;height:calc(100vh - 60px)}
.side{background:#fff;border-right:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;overflow:auto}
.est{display:flex;align-items:center;gap:10px;padding:6px 20px 12px;border-bottom:1px solid var(--line);font-weight:500;width:100%;text-align:left}
.nav{padding:14px 20px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.nav button{display:flex;align-items:center;gap:10px;height:32px;padding:0 6px;border-radius:6px;font-weight:500;width:100%;text-align:left}
.nav button:hover{background:#F3F4F6}.nav button.on{background:#EEF0F3}
.ni{width:20px;height:20px;border-radius:5px;background:#EEF0F3;display:flex;align-items:center;justify-content:center;color:#4B5563}.on .ni{background:#fff}
.cnt{margin-left:auto;font-size:11px;font-weight:600;background:#EEF0F3;border-radius:4px;padding:1px 5px}.cnt.b{background:var(--blue);color:#fff}
.sl{font-size:11.5px;font-weight:600;color:#374151;margin:0 0 8px}
.pill{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;background:#DCFCE7;color:var(--green)}.pill.off{background:#FEF3C7;color:#B45309}
.mini{display:flex;align-items:center;gap:8px;background:#F6F7F9;border-radius:6px;height:30px;padding:0 8px;font-size:11.5px;font-weight:500;margin-top:6px;width:100%;text-align:left}
.up{margin:auto 14px 0;border:1px solid #BBF7D0;border-radius:8px;padding:12px;box-shadow:-3px 0 0 #22C55E inset;text-align:left;width:calc(100% - 28px)}
.main{overflow:auto;padding:24px 28px 40px}
.h1{font-size:20px;font-weight:700;margin:0}.sub{color:var(--mute);margin-top:6px;font-size:12.5px}
.btn{height:36px;border-radius:6px;padding:0 20px;font-weight:600;font-size:13px}.btn.o{border:1.5px solid var(--ink);background:#fff}.btn.k{background:var(--ink);color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:22px}
.c{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 16px}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:600}.ch a,.lk{color:var(--blue);font-size:11.5px;font-weight:500;text-decoration:underline;cursor:pointer}
.cs{color:var(--mute);font-size:11.5px;margin-top:4px}
.it{display:flex;align-items:center;gap:12px;margin-top:14px;width:100%;text-align:left}
.sq{width:34px;height:34px;border-radius:7px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;flex:none;color:#4B5563;font-weight:700;font-size:12px}
.it b{font-weight:600;display:block}.it small{color:var(--mute);font-size:11px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qb{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;transition:border-color .2s,box-shadow .2s}.qb:hover{border-color:#9CA3AF;box-shadow:0 6px 14px -10px rgba(0,0,0,.4)}
.row{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;align-items:center;gap:12px;margin-top:10px;width:100%;text-align:left}
.syn{font-size:11px;font-weight:600;color:var(--green);background:#DCFCE7;border-radius:4px;padding:3px 7px;margin-left:auto}.syn.ing{color:var(--blue);background:#DBEAFE}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.pg i{height:5px;border-radius:9px;background:#22C55E;transform-origin:left;animation:gr .8s ease both}.pg i:nth-child(2){animation-delay:.15s}.pg i:nth-child(3){animation-delay:.3s}.pg i:nth-child(4){animation-delay:.45s}
@keyframes gr{from{transform:scaleX(0)}}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;animation:f .2s}
@keyframes f{from{opacity:0}}
.md{background:#fff;border-radius:12px;width:460px;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:r .25s}@keyframes r{from{transform:translateY(10px);opacity:0}}
.md h3{margin:0 0 4px;font-size:17px}
.fi{border:1px solid #D1D5DB;border-radius:6px;height:38px;padding:0 12px;width:100%;outline:0;margin-top:12px}.fi:focus{border-color:var(--ink)}textarea.fi{height:80px;padding:10px 12px;resize:none}
.lab{font-size:12px;font-weight:600;margin-top:14px;display:block}
.sw{width:36px;height:20px;border-radius:99px;background:#D1D5DB;position:relative;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--ink)}.sw.on::after{left:19px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:40;font-weight:500;animation:f .2s}
.hint{position:fixed;right:20px;bottom:20px;background:var(--blue);color:#fff;padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:500;z-index:30;pointer-events:none}
.ann{background:#111827;color:#fff;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.tbl th,.tbl td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}.tbl th{font-size:11.5px;color:var(--mute);font-weight:600;background:#FAFAFB}
.msg{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:18px;height:calc(100% - 70px)}
.ml button{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;text-align:left}.ml button.on{background:#F3F6FB}
.dotu{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var MSG=[{id:1,t:'Contact',by:'Michel Carpentier',w:'Today',c:'#111',txt:'Hello, do you have a terrace table for six on Saturday evening? We would like to come around 19:30.',u:1},{id:2,t:'Room reservation',by:'Jolien Coppens',w:'3 days ago',c:'#EA580C',txt:'Hi, I would like to book the private room for a birthday on 14 June, about 20 guests. Is a set menu possible?',u:1},{id:3,t:'Contact',by:'Chiara Greco',w:'6 week ago',c:'#DC2626',txt:'Thank you for the lovely dinner last night. Could you share the name of the wine we had with the risotto?',u:0}];
var USERS=[['Erik Hemelsoet','restaurant@lezinneke.be'],['Facebook User Test','testaccess@centralapp.com'],['Tathevik Hayrapetyan','tathevik.hayrapetyan@centralapp.com']];
var S={pg:'dash',active:true,modal:null,sel:1,ann:null,upd:'Last update: 3 weeks ago',sync:{},nets:{ig:1,gb:1},toast:null,hint:true,reply:'',hours:false};
function svg(d,s){return'<svg width="'+(s||14)+'" height="'+(s||14)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'}
var I={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',cust:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7"/>',msg:'<path d="M4 5h16v11H8l-4 4Z"/>',est:'<path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/>',an:'<path d="M3 3v18h18M7 15l4-4 3 3 6-6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',grid:'<circle cx="5" cy="5" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="19" cy="5" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="19" r="1.5"/><circle cx="12" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',tbl:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',r:'<path d="m9 6 6 6-6 6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>',chat:'<path d="M4 5h16v11H8l-4 4Z"/><path d="M8 10h8"/>',mega:'<path d="M3 11v2l13 5V6L3 11ZM16 9a3 3 0 0 1 0 6"/>',clk:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',menu:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/>',job:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/>',up:'<path d="m4 16 6-6 4 4 6-6M20 8v5M20 8h-5"/>',dn:'<path d="m4 8 6 6 4-4 6 6M20 16v-5M20 16h-5"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/>',g:'<path d="M20 12h-8M20 12a8 8 0 1 1-2.3-5.7"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'};
function top(){return'<header class="top"><div class="lg">C</div><div class="cred">Free Credits available: <b>€ '+(S.cred||56)+'</b><button class="gm" data-a="m" data-v="credits">Get More</button></div><div class="me">E</div></header>'}
function side(){var N=[['dash','Dashboard'],['cust','Customers','2.168'],['msg','Messages',MSG.filter(function(m){return m.u}).length+10],['est','Establishments'],['an','Analytics'],['set','Settings']];
 return'<aside class="side"><button class="est" data-a="t" data-v="Establishments: La Primate, Le Zinneke">'+svg(I.grid)+'My establishments</button><nav class="nav">'+N.map(function(n){var id={dash:'dash',cust:'cust',msg:'msg'}[n[0]];return'<button class="'+(S.pg===n[0]?'on':'')+'" data-a="'+(id?'pg':'t')+'" data-v="'+(id||n[1]+' (not in this prototype)')+'"><span class="ni">'+svg(I[n[0]],12)+'</span>'+n[1]+(n[2]?'<span class="cnt'+(n[0]==='msg'?' b':'')+'">'+n[2]+'</span>':'')+'</button>'}).join('')+'</nav>'+
 '<div style="padding:16px 20px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:center"><span class="sl" style="margin:0">Website Status</span><button class="pill'+(S.active?'':' off')+'" data-a="status">'+(S.active?'Active':'Paused')+'</button></div><button class="mini" data-a="t" data-v="laprimate.be opens in a new tab (demo)">'+svg(I.globe,12)+'laprimate.be<span style="margin-left:auto">'+svg(I.r,11)+'</span></button><button class="mini" data-a="t" data-v="Table reservation via Zenchef">'+svg(I.tbl,12)+'Table reservation<span style="margin-left:auto">'+svg(I.r,11)+'</span></button></div>'+
 '<div style="padding:16px 20px"><div class="sl">Need Help?</div><div class="nav" style="padding:0;border:0"><button data-a="t" data-v="Help Center (demo)"><span class="ni">'+svg(I.help,12)+'</span>Help Center</button><button data-a="t" data-v="Chat opens (demo)"><span class="ni">'+svg(I.chat,12)+'</span>Chat &amp; Email</button></div></div>'+
 '<button class="up" data-a="m" data-v="credits"><b style="display:flex;justify-content:space-between">Upgrade'+svg(I.r,12)+'</b><div class="cs">Get more features with Pro</div></button><div style="padding:16px 20px 6px;color:var(--mute);font-size:11px;line-height:1.8;border-top:1px solid var(--line);margin-top:16px">Last updated: 2 days ago<br>Creation date: Apr 29, 2020</div></aside>'}
function dash(){var unread=MSG.filter(function(m){return m.u}).length;return'<div style="display:flex;align-items:flex-start;justify-content:space-between"><div><h1 class="h1">Welcome back, Erik!</h1><div class="sub">Here’s what’s happening with your business today</div></div><div style="display:flex;gap:12px"><button class="btn o" style="width:92px" data-a="m" data-v="preview">Preview</button><button class="btn k" data-a="t" data-v="The website editor opens here (demo)">Edit Website</button></div></div>'+
 (S.ann?'<div class="ann">'+svg(I.mega,16)+'<span style="flex:1">Announcement bar live: “'+S.ann+'”</span><button data-a="unann" aria-label="Remove announcement" style="opacity:.7">'+svg(I.x,14)+'</button></div>':'')+
 '<div class="g"><div style="display:flex;flex-direction:column;gap:14px;grid-column:1/3"><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><section class="c"><div class="ch">Recent Activities<a data-a="t" data-v="Full activity log (demo)">View all</a></div><div class="cs">Be updated about your website last updates</div>'+
 '<div class="it" style="justify-content:space-between"><span><b>Customer Registration</b><small>12 new customers today</small></span><span style="color:#DC2626;font-weight:600;font-size:11px;display:flex;gap:3px">'+svg(I.dn,12)+'32</span></div><div class="it" style="justify-content:space-between"><span><b>Visitors Engagement</b><small style="color:var(--green)">● 4 active visitors now</small></span><span style="color:var(--green);font-weight:600;font-size:11px;display:flex;gap:3px">'+svg(I.up,12)+'2</span></div><div class="it"><span><b>Content Updates</b><small>'+S.upd+'</small></span></div></section>'+
 '<section class="c"><div class="ch">Inbox<a data-a="pg" data-v="msg">View all</a></div><div class="cs">You have '+(unread+10)+' new messages</div>'+MSG.map(function(m){return'<button class="it" data-a="open" data-v="'+m.id+'"><span class="sq">'+m.by[0]+'</span><span style="flex:1"><b>'+m.t+(m.u?' <span class="dotu" style="display:inline-block;margin:0 0 1px 4px"></span>':'')+'</b><small>By '+m.by+'</small></span><span style="font-size:10.5px;font-weight:600;color:'+m.c+';align-self:flex-start">'+m.w+'</span></button>'}).join('')+'</section></div>'+
 '<section class="c"><div class="ch">Quick Actions<a data-a="t" data-v="Business info editor (demo)">Edit other information</a></div><div class="qa">'+[['mega','Announcement bar','Schedule a new message','ann'],['clk','Exceptional hours','Add custom hours or closing dates','hours'],['menu','Menu','Publish a menu','menu'],['job','Recruitment','Add a new job offer','job']].map(function(q){return'<button class="qb" data-a="m" data-v="'+q[3]+'"><span class="sq">'+svg(I[q[0]],16)+'</span><span><b style="font-weight:600">'+q[1]+'</b><div class="cs">'+q[2]+'</div></span></button>'}).join('')+'</div></section>'+
 '<section class="c"><div class="ch">Network connection<a data-a="m" data-v="nets">Add connections</a></div>'+[['ig','Instagram','Your Instagram wall'],['gb','Google business listing','Keep the account up to date'],['fb','Facebook page','Share posts and opening hours'],['tt','TikTok','Show your latest videos']].filter(function(n){return S.nets[n[0]]}).map(function(n){return'<div class="row"><span class="sq">'+(n[0]==='ig'?svg(I.ig,16):n[0]==='gb'?svg(I.g,16):n[0]==='fb'?'f':'♪')+'</span><span><b style="font-weight:600">'+n[1]+'</b><div class="cs">'+n[2]+'</div></span><button class="syn'+(S.sync[n[0]]?' ing':'')+'" data-a="sync" data-v="'+n[0]+'">'+(S.sync[n[0]]?'Syncing…':'Synced')+'</button></div>'}).join('')+'</section>'+
 '<section class="c" style="display:flex;align-items:center;gap:12px"><span class="sq">'+svg(I.sparkle,16)+'</span><span style="flex:1"><b style="font-weight:600">Whats New</b> <span class="cnt" style="margin-left:6px">6</span><div class="cs">We’re continuously making improvements. Find a list of changes and improvements here.</div></span><a class="lk" style="align-self:flex-start" data-a="t" data-v="Changelog: menu PDF import, new themes, faster editor">Discover latest changes</a></section></div>'+
 '<div style="display:flex;flex-direction:column;gap:14px"><section class="c" style="border-color:#22C55E"><div class="ch">Creation Assistant <span style="background:#111;color:#fff;font-size:10px;border-radius:4px;padding:2px 6px">Beta</span></div><div class="cs">All sections of your website are filled in</div><div style="text-align:right;color:var(--green);font-weight:600;font-size:12px;margin-top:10px">100%</div><div class="pg" style="margin-top:6px"><i></i><i></i><i></i><i></i></div></section>'+
 '<section class="c"><div class="ch">Users<a data-a="m" data-v="invite">Invite new</a></div>'+USERS.map(function(u){return'<div class="it"><span class="sq">'+u[0].split(' ').map(function(w){return w[0]}).join('').slice(0,2)+'</span><span style="min-width:0"><b>'+u[0]+'</b><small style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+u[1]+'</small></span></div>'}).join('')+'<button class="row" style="justify-content:center;padding:8px;font-weight:600;font-size:12px" data-a="t" data-v="'+USERS.length+' users have access">View all '+svg(I.r,11)+'</button></section>'+
 '<section class="c"><div class="ch">Active Integrations</div>'+[['Z','Zenchef','Reservation'],['D','Deliveroo','Orders'],['T','Takeaway.com','Orders'],['U','Uber eats','Orders']].map(function(n){return'<button class="row" data-a="t" data-v="'+n[1]+': connected, last sync 5 minutes ago"><span class="sq">'+n[0]+'</span><span style="flex:1"><b style="font-weight:600">'+n[1]+'</b><div class="cs">'+n[2]+'</div></span>'+svg(I.r,12)+'</button>'}).join('')+'</section></div></div>';}
function msgs(){var m=MSG.filter(function(x){return x.id===S.sel})[0];return'<h1 class="h1">Messages</h1><div class="msg"><div class="c ml" style="padding:0;overflow:auto">'+MSG.map(function(x){return'<button class="'+(x.id===S.sel?'on':'')+'" data-a="open" data-v="'+x.id+'">'+(x.u?'<span class="dotu"></span>':'<span style="width:8px"></span>')+'<span style="flex:1;min-width:0"><b style="display:flex;justify-content:space-between">'+x.by+'<small style="color:var(--mute);font-weight:500">'+x.w+'</small></b><div class="cs">'+x.t+'</div><div class="cs" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+x.txt+'</div></span></button>'}).join('')+'</div>'+
 '<div class="c" style="display:flex;flex-direction:column"><div style="display:flex;gap:12px;align-items:center"><span class="sq">'+m.by[0]+'</span><span><b>'+m.by+'</b><div class="cs">'+m.t+' · '+m.w+'</div></span></div><p style="font-size:14px;line-height:1.65;margin:20px 0">'+m.txt+'</p>'+(m.re?'<div style="align-self:flex-end;background:#111827;color:#fff;border-radius:10px 10px 2px 10px;padding:10px 14px;max-width:70%;line-height:1.5">'+m.re+'</div>':'')+'<div style="margin-top:auto;display:flex;gap:10px"><input class="fi" id="rep" style="margin:0" placeholder="Write a reply…" value="'+S.reply+'"><button class="btn k" data-a="send">Send</button></div></div></div>'}
function cust(){var R=[['Michel Carpentier','Today','3 visits','Newsletter'],['Jolien Coppens','3 days ago','1 visit','Room booking'],['Chiara Greco','6 weeks ago','5 visits','Newsletter'],['Lucas Peeters','2 months ago','2 visits','Deliveroo'],['Emma Janssens','2 months ago','8 visits','Zenchef']];return'<div style="display:flex;justify-content:space-between;align-items:center"><div><h1 class="h1">Customers</h1><div class="sub">2.168 people have registered, booked or ordered</div></div><button class="btn o" data-a="t" data-v="Exported customers.csv (demo)">Export</button></div><table class="tbl"><tr><th>Name</th><th>Last activity</th><th>Visits</th><th>Source</th></tr>'+R.map(function(r){return'<tr>'+r.map(function(c,k){return'<td'+(k===0?' style="font-weight:600"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function modal(){var m=S.modal;if(!m)return'';var B=function(lbl,a){return'<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><button class="btn o" data-a="close">Cancel</button><button class="btn k" data-a="'+a+'">'+lbl+'</button></div>'};var h;
 if(m==='ann')h='<h3>Announcement bar</h3><div class="cs">Shown at the top of laprimate.be</div><input class="fi" id="annt" value="Terrace is open again from Friday!"><label class="lab">Show from</label><input class="fi" type="date" value="2026-06-12" style="margin-top:6px">'+B('Publish','pubann');
 else if(m==='hours')h='<h3>Exceptional hours</h3><div class="cs">Add custom hours or closing dates</div><input class="fi" type="date" value="2026-08-15"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span style="font-weight:600">Closed all day</span><button class="sw'+(S.hours?' on':'')+'" data-a="hrs" aria-label="Closed all day"></button></div>'+(S.hours?'':'<div style="display:flex;gap:10px"><input class="fi" value="12:00"><input class="fi" value="15:00"></div>')+B('Save','pub');
 else if(m==='menu')h='<h3>Menu</h3><div class="cs">Publish a menu on your website</div><button style="border:1.5px dashed #D1D5DB;border-radius:8px;height:110px;width:100%;margin-top:14px;color:var(--mute)" data-a="t" data-v="menu-summer.pdf uploaded (demo)">Drop a PDF or photo here, or click to upload</button>'+B('Publish','pub');
 else if(m==='job')h='<h3>Recruitment</h3><div class="cs">Add a new job offer</div><input class="fi" value="Line cook, full time"><textarea class="fi">Join our kitchen team in Brussels. Evening shifts, 4 days a week.</textarea>'+B('Publish','pub');
 else if(m==='invite')h='<h3>Invite a user</h3><div class="cs">They get access to this establishment</div><input class="fi" id="inv" placeholder="name@email.com" value="anna.peeters@laprimate.be"><label class="lab">Role</label><select class="fi" style="margin-top:6px"><option>Editor</option><option>Admin</option></select>'+B('Send invite','invite');
 else if(m==='nets')h='<h3>Add connections</h3><div class="cs">Connect your channels to keep them in sync</div>'+[['fb','Facebook page'],['tt','TikTok']].map(function(n){return'<div class="row"><span class="sq">'+(n[0]==='fb'?'f':'♪')+'</span><b style="flex:1">'+n[1]+'</b><button class="btn '+(S.nets[n[0]]?'o':'k')+'" style="height:30px;padding:0 12px" data-a="net" data-v="'+n[0]+'">'+(S.nets[n[0]]?'Connected':'Connect')+'</button></div>'}).join('')+'<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn k" data-a="close">Done</button></div>';
 else if(m==='credits')h='<h3>Get more credits</h3><div class="cs">Credits pay for AI texts, translations and SMS reminders</div>'+[['€ 20','100 AI texts'],['€ 50','300 AI texts + SMS'],['€ 100','Unlimited for 3 months']].map(function(p,k){return'<button class="row" data-a="t" data-v="Checkout is disabled in this prototype"><b style="width:60px">'+p[0]+'</b><span class="cs" style="margin:0;flex:1">'+p[1]+'</span>'+(k===1?'<span class="pill">Popular</span>':'')+'</button>'}).join('')+'<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn o" data-a="close">Close</button></div>';
 else if(m==='preview')h='<div style="border-radius:8px;overflow:hidden;border:1px solid var(--line)"><div style="height:150px;background:linear-gradient(135deg,#3F2A1D,#9A5B34);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px">'+(S.ann?'<div style="position:absolute;margin-top:-130px;font-size:11px;background:#111;padding:4px 8px;border-radius:4px">'+S.ann+'</div>':'')+'<b style="font-size:24px">La Primate</b><span style="opacity:.8">Italian kitchen · Brussels</span></div><div style="padding:14px;display:flex;gap:8px"><span class="btn k" style="display:inline-flex;align-items:center;height:30px">Book a table</span><span class="btn o" style="display:inline-flex;align-items:center;height:30px">Order online</span></div></div>'+'<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn o" data-a="close">Close preview</button></div>';
 return'<div class="ov" data-a="close"><div class="md" data-stop role="dialog" style="position:relative">'+h+'</div></div>';}
function render(){var f=document.activeElement&&document.activeElement.id;document.getElementById('app').innerHTML=top()+'<div class="wrap">'+side()+'<main class="main">'+(S.pg==='dash'?dash():S.pg==='msg'?msgs():cust())+'</main></div>'+modal()+(S.toast?'<div class="toast" role="status">'+S.toast+'</div>':'')+(S.hint?'<div class="hint">Prototype · try Quick Actions, the inbox and Website Status</div>':'');
 var r=document.getElementById('rep');if(r){r.oninput=function(){S.reply=r.value};r.onkeydown=function(e){if(e.key==='Enter')send()};if(f==='rep')r.focus()}}
var tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(function(){S.toast=null;render()},2300)}
function done(what){S.modal=null;S.upd=what+' · just now';render();toast(what+' published on laprimate.be')}
function send(){if(!S.reply.trim())return;var m=MSG.filter(function(x){return x.id===S.sel})[0];m.re=S.reply;S.reply='';render();toast('Reply sent to '+m.by)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;var a=b.dataset.a,v=b.dataset.v;S.hint=false;
 if(a==='pg')S.pg=v;
 else if(a==='open'){S.pg='msg';S.sel=+v;MSG.forEach(function(m){if(m.id===+v)m.u=0});}
 else if(a==='status'){S.active=!S.active;render();toast(S.active?'Website is live again':'Website paused. Visitors see a “back soon” page');return;}
 else if(a==='m'){S.modal=v;S.hours=false;}
 else if(a==='close')S.modal=null;
 else if(a==='pubann'){S.ann=document.getElementById('annt').value||'New announcement';done('Announcement bar');return;}
 else if(a==='pub'){done({hours:'Exceptional hours',menu:'Menu',job:'Job offer'}[S.modal]);return;}
 else if(a==='hrs')S.hours=!S.hours;
 else if(a==='invite'){var em=document.getElementById('inv').value||'new.user@laprimate.be';USERS.push([em.split('@')[0].replace(/\./g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()}),em]);S.modal=null;render();toast('Invite sent to '+em);return;}
 else if(a==='net'){S.nets[v]=S.nets[v]?0:1;}
 else if(a==='sync'){S.sync[v]=1;render();setTimeout(function(){S.sync[v]=0;render();toast('Synced just now')},1200);return;}
 else if(a==='unann'){S.ann=null;}
 else if(a==='send'){send();return;}
 else if(a==='t'){toast(v);return;}
 render();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
render();
})();
