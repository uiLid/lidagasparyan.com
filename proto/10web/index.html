<style>
@font-face{font-family:'Open Sans';src:url(../assets/opensans.woff2) format('woff2');font-weight:300 800;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Open Sans',system-ui,sans-serif;color:#111;background:#fff;font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;height:100vh;gap:20px 20px;padding:10px 10px 10px 10px}
.logo{width:42px;height:42px;border:1px solid #E6E6E6;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff}
.top{display:flex;align-items:center;gap:12px;height:42px;border:1px solid #E6E6E6;border-radius:8px;padding:0 6px 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.prod{display:flex;align-items:center;gap:8px;font-weight:600;padding-right:12px;border-right:1px solid #E6E6E6;height:100%}
.search{flex:1;display:flex;align-items:center;gap:8px;color:#9A9A9A}
.search input{border:0;outline:0;font:inherit;width:100%}
.bbtn{height:26px;padding:0 8px;border-radius:3px;font-weight:600;font-size:12.5px}.bbtn.blk{background:#000;color:#fff}.bbtn.out{border:1px solid #000}
.ico{display:flex;gap:14px;align-items:center;padding:0 10px;border-left:1px solid #E6E6E6;height:24px;color:#C4C4C4}
.ava{width:36px;height:36px;border-radius:6px;background:#F2F2F2;display:flex;align-items:center;justify-content:center;color:#B5B5B5}.ava.on{background:#000;color:#fff}
.side{border:1px solid #E6E6E6;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;transition:width .25s ease;overflow:hidden}
.side.open{width:220px;padding:10px 10px 10px 14px}.side.closed{width:42px;padding:10px 4px;align-items:center}
.row1{display:flex;justify-content:space-between;align-items:center;height:24px}
.hide{display:flex;align-items:center;gap:6px;font-size:12.5px}
.env{display:flex;align-items:center;gap:6px;background:#E9F7EC;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:600}.env i{width:7px;height:7px;border-radius:50%;background:#21B04A}.env.stg{background:#FFF3DC}.env.stg i{background:#E3A008}
.prev{margin-top:12px;height:100px;border-radius:6px;overflow:hidden;position:relative;display:grid;grid-template-columns:24% 25% 25% 24% 12%}
.prev span:nth-child(1){background:#F0A091}.prev span:nth-child(2){background:#8D97CF}.prev span:nth-child(3){background:#F5F0FB}.prev span:nth-child(4){background:#F9E58A}.prev span:nth-child(5){background:#9C5C7F}
.score{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #21B04A;color:#21B04A;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.wpbox{position:absolute;right:8px;top:8px;background:#fff;border-radius:4px;display:flex;box-shadow:0 1px 3px rgba(0,0,0,.15)}.wpbox b{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.url{align-self:center;margin:12px 0 8px;background:#F2F2F2;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;height:30px;font-size:12.5px;font-weight:500;border-radius:5px;text-align:left;padding:0 4px;width:100%}
.nav button:hover{background:#F5F5F5}.nav button.cur{background:#F2F2F2;font-weight:600}
.nav button .chev{margin-left:auto;color:#333}
.closed .nav button{justify-content:center;width:32px;padding:0}
.sub button{padding-left:34px;height:28px;font-weight:400}.sub button.act{color:#3339F1}
.store{margin-top:auto;background:#F2F2FC;border-radius:6px;padding:10px;font-weight:600}.store small{display:block;color:#3339F1;font-weight:400;margin-top:4px}
.qbox{display:flex;flex-direction:column;gap:2px;border:1px solid #E6E6E6;border-radius:6px;margin:10px 0}.qbox b{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.main{overflow:auto;position:relative;border-radius:8px}
.h-wave{font-weight:700;font-size:13px;margin:8px 0 6px}.h1{font-size:20px;font-weight:700;margin:0 0 6px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,360px));gap:20px;margin-top:40px}
.oc{border:1px solid #E6E6E6;border-radius:6px;padding:56px 20px 20px;height:325px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.oc:hover,.oc.sel{border-color:#000;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.oc .k{font-size:10.5px;letter-spacing:.2em;font-weight:600}.oc h3{font-size:20px;line-height:1.5;margin:22px 0 4px}.oc p{margin:0;font-size:12px}
.oc .go{margin-top:auto;align-self:flex-end;width:180px;height:40px;border-radius:4px;background:#000;color:#fff;font-weight:600}.oc.sel .go{background:#3339F1}
.tabs{display:inline-flex;border:1px solid #E6E6E6;border-radius:6px;padding:3px}.tabs button{padding:8px 18px;border-radius:4px;color:#555}.tabs button.on{background:#000;color:#fff}
.panel{border:1px solid #E6E6E6;border-radius:6px;padding:20px;margin-top:22px}
.sec-grid{display:grid;grid-template-columns:440px 180px 1fr;gap:20px 20px;align-items:center}
.in{height:40px;background:#F2F2F2;border:1px solid #E6E6E6;border-radius:4px;padding:0 14px;display:flex;align-items:center;color:#AAA}
.obtn{height:40px;border:1px solid #000;border-radius:4px;font-size:12.5px}.obtn.done{background:#000;color:#fff}
.grant{grid-row:1/4;grid-column:3;background:#E8E8FB;border-radius:4px;padding:20px;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;position:relative;margin-left:30px}
.grant h3{font-size:16px;margin:0 0 6px}.grant p{margin:0;font-size:14px;line-height:1.5}
.sw{width:36px;height:20px;border-radius:999px;background:#C9C9C9;position:relative;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:#111}.sw.on::after{left:19px}
.gi{position:absolute;left:20px;top:20px;width:40px;height:40px;border-radius:6px;background:#000;display:flex;align-items:center;justify-content:center}
.pay-hero{border:1px solid #000;border-radius:6px;padding:20px;display:flex;align-items:center;gap:20px}.badge{display:inline-block;background:#E8E8FB;border-radius:999px;padding:3px 8px;font-size:12px}
.pm{border:1px solid #E6E6E6;border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:20px;margin-top:16px}.pm .dots{color:#CCC;letter-spacing:-2px}
.save{height:40px;width:180px;border-radius:4px;background:#8C8C8C;color:#EDEDED;font-weight:600}.save.ready{background:#000;color:#fff}
.acct{position:absolute;right:10px;top:62px;width:300px;background:#000;color:#fff;border-radius:10px;padding:20px 10px 20px;z-index:10;box-shadow:0 20px 40px -12px rgba(0,0,0,.4)}
.acct .r{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-radius:6px;font-weight:600;width:100%}.acct .r:hover{background:#151515}
.ws{background:#1F1F1F;border-radius:8px;padding:12px 14px;margin:10px 0}
.wsi{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}.wsi .l{width:30px;height:30px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center;font-weight:700}.wsi.cur .l{background:#fff;color:#000}.wsi small{display:block;color:#BBB;font-weight:400}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:8px 16px;font-size:12px;opacity:.92;pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111;color:#fff;border-radius:6px;padding:10px 16px;font-weight:600;z-index:30}
</style>
